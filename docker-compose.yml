name: pixelforge

x-app-image: &app-image
    build:
        context: .
        dockerfile: docker/php/Dockerfile
        args:
            WWWUSER: '${WWWUSER:-1000}'
            WWWGROUP: '${WWWGROUP:-1000}'
    image: 'pixelforge/app:local'
    extra_hosts:
        - 'host.docker.internal:host-gateway'
    volumes:
        - '.:/var/www/html'
    networks:
        - app

services:
    app:
        <<: *app-image
        restart: unless-stopped
        depends_on:
            mysql:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'php', '-r', 'exit(@fsockopen("127.0.0.1", 9000) ? 0 : 1);']
            interval: 3s
            timeout: 3s
            retries: 5
            start_period: 600s
            start_interval: 3s
    queue:
        <<: *app-image
        command: ['php', 'artisan', 'queue:listen', '--tries=1']
        restart: unless-stopped
        depends_on:
            app:
                condition: service_healthy
    scheduler:
        <<: *app-image
        command: ['php', 'artisan', 'schedule:work']
        restart: unless-stopped
        depends_on:
            app:
                condition: service_healthy
    nginx:
        image: 'nginx:1.28-alpine'
        restart: unless-stopped
        ports:
            - '${APP_PORT:-8000}:80'
        volumes:
            - '.:/var/www/html:ro'
            - './docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro'
        networks:
            - app
        depends_on:
            app:
                condition: service_healthy
            node:
                condition: service_healthy
    node:
        <<: *app-image
        entrypoint: []
        command: ['sh', '-c', 'rm -f public/hot && npm install --no-audit --no-fund && exec npm run dev']
        restart: unless-stopped
        environment:
            HOME: /tmp
        ports:
            - '${VITE_PORT:-5173}:5173'
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'test', '-f', 'public/hot']
            interval: 3s
            timeout: 3s
            retries: 5
            start_period: 600s
            start_interval: 3s
    mysql:
        image: 'mysql:8.0'
        restart: unless-stopped
        ports:
            - '127.0.0.1:${FORWARD_DB_PORT:-3307}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-local-dev-password}'
            MYSQL_DATABASE: '${DB_DATABASE:-pixelforge}'
            MYSQL_USER: '${DB_USERNAME:-pixelforge}'
            MYSQL_PASSWORD: '${DB_PASSWORD:-local-dev-password}'
        volumes:
            - 'mysql-data:/var/lib/mysql'
        networks:
            - app
        healthcheck:
            test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
            interval: 3s
            timeout: 5s
            retries: 40
    phpmyadmin:
        image: 'phpmyadmin:5'
        restart: unless-stopped
        ports:
            - '127.0.0.1:${PHPMYADMIN_PORT:-8080}:80'
        environment:
            PMA_HOST: mysql
        networks:
            - app
        depends_on:
            mysql:
                condition: service_healthy
networks:
    app:
        driver: bridge
volumes:
    mysql-data:
        driver: local
